<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>inom tayo sa saturday?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #14182b;
    --bg-glow: #2a2150;
    --ink: #f6efe9;
    --muted: #a7a3c0;
    --accent: #ffb88c;
    --accent-ink: #2a1630;
    --line: #4a4670;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(60vmax 60vmax at 80% -10%, var(--bg-glow), transparent 60%),
      radial-gradient(50vmax 50vmax at -10% 110%, #3a1f4a, transparent 55%);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  .panel { max-width: 640px; width: 100%; }
  h1 {
    margin: 0 0 14px;
    font-weight: 800;
    font-size: clamp(2.6rem, 11vw, 5.4rem);
    line-height: 0.98;
    letter-spacing: -0.035em;
  }
  .sub { margin: 0 0 40px; color: var(--muted); font-size: clamp(1rem, 3.6vw, 1.2rem); }
  .actions { display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 1.15rem;
    border-radius: 999px;
    padding: 16px 44px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #yes {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 8px 30px rgba(255, 184, 140, .25);
  }
  #yes:hover { box-shadow: 0 8px 40px rgba(255, 184, 140, .45); }
  #yes:focus-visible, #no:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .slot { display: inline-block; }
  #no {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    transition: left .28s cubic-bezier(.2, .9, .3, 1.2), top .28s cubic-bezier(.2, .9, .3, 1.2);
    z-index: 5;
    user-select: none;
    -webkit-user-select: none;
  }
  .hint { min-height: 1.6em; margin: 28px 0 0; color: var(--muted); font-size: 1rem; }

  #pick, #done { display: none; position: relative; z-index: 2; }
  .stage-pick #ask, .stage-done #ask, .stage-done #pick { display: none; }
  .stage-pick #pick, .stage-done #done { display: block; }
  .choice {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    min-width: 140px;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .choice:hover, .choice:focus-visible {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    outline: none;
  }
  .date {
    margin: 4px 0 6px;
    font-weight: 800;
    font-size: clamp(3rem, 14vw, 6.4rem);
    letter-spacing: -0.04em;
    color: var(--accent);
    line-height: 1;
  }
  .day { margin: 0 0 36px; font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 500; }
  .where {
    display: inline-block;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 1.05rem;
    min-width: 220px;
  }
  .where b { color: var(--ink); font-weight: 500; }
  .note { margin: 22px 0 0; color: var(--muted); font-size: .95rem; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  @media (prefers-reduced-motion: reduce) {
    #no, #yes { transition: none; }
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <section class="panel" id="ask">
    <h1>inom tayo sa saturday?</h1>

    <div class="actions">
      <button id="yes" type="button">Yes</button>
      <span class="slot" id="slot"><button id="no" type="button" tabindex="-1">No</button></span>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <section class="panel" id="pick">
    <h1>san tayo?</h1>
    <div class="actions">
      <button class="choice" type="button" data-place="Katips">Katips</button>
      <button class="choice" type="button" data-place="Pobla">Pobla</button>
    </div>
  </section>

  <section class="panel" id="done">
    <h1>save the date</h1>
    <div class="date" id="dateText"></div>
    <p class="day" id="dayText"></p>
    <div class="where"><b id="areaText"></b><br><span id="whereText"></span></div>
  </section>
</main>

<script>
/* ============================================================
   I-EDIT DITO ANG DETAILS
   ============================================================ */
const EVENT_DATE = "11/14/26";       // petsa (Saturday ang Nov 14, 2026)
const EVENT_DAY  = "Saturday";
// >>> DITO MO ILAGAY ANG LOCATION <<<
const EVENT_LOCATION = "Sure na bes ah";
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const yes = $("yes"), no = $("no"), slot = $("slot"), hint = $("hint");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Ang No button na tumatakbo ---------- */
let floating = false;
let dodges = 0;
let lastDodge = 0;


function rand(min, max) { return Math.random() * (max - min) + min; }

function startFloating() {
  if (floating) return;
  const r = no.getBoundingClientRect();
  slot.style.width = r.width + "px";   // para hindi gumalaw ang layout
  slot.style.height = r.height + "px";
  no.style.position = "fixed";
  no.style.left = r.left + "px";
  no.style.top = r.top + "px";
  floating = true;
}

function overlaps(a, b, pad) {
  return !(a.right + pad < b.left || a.left - pad > b.right ||
           a.bottom + pad < b.top || a.top - pad > b.bottom);
}

function dodge() {
  const now = Date.now();
  if (now - lastDodge < 90) return;   // iwas sobrang bilis na talon
  lastDodge = now;
  startFloating();

  const w = no.offsetWidth, h = no.offsetHeight;
  const m = 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  const cur = no.getBoundingClientRect();
  const yesRect = yes.getBoundingClientRect();

  let x = cur.left, y = cur.top;
  for (let i = 0; i < 50; i++) {
    const tx = rand(m, Math.max(m, vw - w - m));
    const ty = rand(m, Math.max(m, vh - h - m));
    const box = { left: tx, top: ty, right: tx + w, bottom: ty + h };
    const far = Math.hypot(tx - cur.left, ty - cur.top) > Math.min(vw, vh) * 0.3;
    if (far && !overlaps(box, yesRect, 24)) { x = tx; y = ty; break; }
  }
  no.style.left = x + "px";
  no.style.top = y + "px";

  dodges++;
  if (hints[dodges]) hint.textContent = hints[dodges];
  // lumalaki nang kaunti ang Yes sa bawat iwas
  yes.style.transform = "scale(" + Math.min(1 + dodges * 0.03, 1.4) + ")";
}

/* hindi mapipindot: mouse, touch, pen, at keyboard */
no.addEventListener("pointerenter", dodge);
no.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(); });
no.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive: false });
no.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); dodge(); });
no.addEventListener("focus", () => { no.blur(); dodge(); });

/* umiiwas bago pa dumating ang cursor */
document.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse" || $("ask").offsetParent === null) return;
  const r = no.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  if (d < 90) dodge();
});

window.addEventListener("resize", () => {
  if (!floating) return;
  const r = no.getBoundingClientRect();
  if (r.right > innerWidth || r.bottom > innerHeight) dodge();
});

/* ---------- Fireworks ---------- */
const canvas = $("fx"), ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
const parts = [];
const colors = ["#ffb88c", "#ff7a90", "#8fd3ff", "#f6efe9", "#ffd36e", "#c3a6ff"];
let running = false;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

function burst(x, y) {
  const n = reduceMotion ? 28 : 80;
  const c1 = colors[(Math.random() * colors.length) | 0];
  const c2 = colors[(Math.random() * colors.length) | 0];
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + rand(-0.05, 0.05);
    const s = rand(1.2, 5.2);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(55, 95), age: 0, color: i % 2 ? c1 : c2, size: rand(1.2, 2.4)
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}

function tick() {
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age++;
    p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.05;
    p.x += p.vx; p.y += p.vy;
    const t = 1 - p.age / p.life;
    if (t <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, W, H); }
}

/* ---------- Pag Yes ---------- */
let celebrated = false;

function fireworks(count) {
  const gap = reduceMotion ? 1400 : 650;
  let shots = 0;
  const id = setInterval(() => {
    burst(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.55));
    if (++shots >= count) clearInterval(id);
  }, gap);
  burst(W / 2, H * 0.3);
}

/* Hakbang 1: Yes -> fireworks -> piliin ang lugar */
yes.addEventListener("click", () => {
  if (celebrated) return;
  celebrated = true;
  no.style.display = "none";
  document.body.classList.add("stage-pick");
  fireworks(4);
});

/* Hakbang 2: piliin ang Katips o Pobla -> save the date */
document.querySelectorAll(".choice").forEach((btn) => {
  btn.addEventListener("click", () => {
    const place = btn.dataset.place;
    $("dateText").textContent = EVENT_DATE;
    $("dayText").textContent = EVENT_DAY;
    $("areaText").textContent = "Area: " + place;
    $("whereText").textContent = EVENT_LOCATION;
    document.body.classList.remove("stage-pick");
    document.body.classList.add("stage-done");
    document.title = "save the date: " + EVENT_DATE;
    fireworks(14);
  });
});

document.addEventListener("pointerdown", (e) => {
  if (celebrated) burst(e.clientX, e.clientY);
});
</script>
</body>
</html>
